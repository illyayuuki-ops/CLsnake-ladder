<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2.5D Snakes & Ladders: 20 Boards</title>
<style>
@property --tilt{syntax:'<angle>';inherits:true;initial-value:0deg}
@property --cx{syntax:'<length>';inherits:false;initial-value:0px}
@property --cy{syntax:'<length>';inherits:false;initial-value:0px}
@property --zoom{syntax:'<number>';inherits:false;initial-value:1}
:root{--tilt:0deg;transition:--tilt .8s ease-in-out;--bg1:#1b3d7a;--bg2:#070d1f;--ink:#eaf2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#cfe2ff;--bg2:#8fb0e6;--ink:#10224a}}
:root[data-theme="light"]{--bg1:#cfe2ff;--bg2:#8fb0e6;--ink:#10224a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;min-height:100vh;color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2))}
.die{font-size:40px;line-height:1}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
button{font:inherit;font-weight:700;padding:10px 18px;border-radius:12px;border:0;background:#ffc83d;color:#3a2a00;cursor:pointer}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible{outline:3px solid #ffc83d;outline-offset:3px}

/* 1. The stage gives depth: things far away look smaller */
.scene{width:600px;margin:40px auto 130px;perspective:1300px;perspective-origin:50% 30%}
@media (max-width:640px){.scene{zoom:.5}}

/* 2. The board is tilted back; children keep their 3D position */
.board{position:relative;width:600px;height:600px;transform-origin:300px 300px;
  /* camera: zoom, tilt, then slide the board so the followed spot sits at the centre */
  transform:scale(var(--zoom)) rotateX(var(--tilt)) translate(var(--cx),var(--cy));transform-style:preserve-3d;
  transition:--cx .3s linear,--cy .3s linear,--zoom .8s ease-in-out}
.board.slow{transition:--cx .9s ease-in-out,--cy .9s ease-in-out,--zoom .8s ease-in-out}
.top{position:absolute;inset:0;border-radius:14px;background:#2a6fb5 var(--map) center/cover}
.grid{position:absolute;inset:0;display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);transform:translateZ(1px)}
.grid span{border:1px solid rgba(255,255,255,.28);font:800 12px system-ui;color:#fff;padding:3px 4px;text-shadow:0 0 3px #000,0 0 3px #000}
.flat{position:absolute;inset:0;transform:translateZ(2px);pointer-events:none}

/* 3. Thickness: a front wall and a slab underneath */
.front{position:absolute;left:0;top:100%;width:100%;height:30px;background:linear-gradient(#1d3563,#0a1226);transform-origin:top;transform:rotateX(-90deg);border-radius:0 0 10px 10px}
.base{position:absolute;inset:0;transform:translateZ(-30px);background:#0a1226;border-radius:14px;box-shadow:0 50px 70px rgba(0,0,0,.55)}

/* 4. Standing things: pawn = flat shadow + a lifted upright picture */
.pawn{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .28s linear,top .28s linear}
.pawn.slide{transition:left .9s ease-in-out,top .9s ease-in-out}
.shadow{position:absolute;left:-15px;top:-6px;width:30px;height:12px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);transform:translateZ(3px)}
.lift{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.up{position:absolute;left:-20px;bottom:0;width:40px;height:60px;transform-origin:50% 100%;transform:translateZ(3px) rotateX(calc(-1 * var(--tilt)))}
.up svg{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.hop .lift{animation:hop .28s ease-out}
@keyframes hop{50%{transform:translateZ(22px)}}
@media (prefers-reduced-motion:reduce){.hop .lift{animation:none}.pawn,.pawn.slide{transition:none}}
select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;margin-left:6px}
select option{color:#10224a}
.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.info{text-align:center;opacity:.85;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="controls">
  <label>Board <select id="layout" aria-label="Choose a board"></select></label>
  <button id="newgame" class="ghost">New game</button>
</div>
<div class="controls">
  <span class="die" id="die" aria-hidden="true">⚀</span>
  <button id="roll">Roll</button><span id="msg" aria-live="polite"></span>
</div>
<div class="info" id="info"></div>
<div class="scene"><div class="board" id="board">
  <div class="base"></div><div class="top"></div><div class="grid" id="grid"></div>
  <svg class="flat" id="flat" viewBox="0 0 600 600"></svg><div class="front"></div>
</div></div>

<script>
/* ============ 1. THE 20 BOARDS are only data ============
   s = snakes {head: tail}   l = ladders {bottom: top}
   To add a board, add one more line here. Nothing else changes. */
const LAYOUTS=[{"s":{"91":52,"94":64,"89":53,"74":55,"70":50,"58":20,"65":37,"46":28,"19":5,"29":10},"l":{"9":35,"16":38,"15":36,"47":73,"45":75,"30":48,"79":96,"60":80,"62":85}},{"s":{"99":78,"92":72,"71":51,"79":58,"81":41,"64":38,"45":27,"50":10,"19":5,"29":9},"l":{"20":40,"17":44,"7":33,"34":65,"53":74,"49":73,"75":93,"76":96,"77":97}},{"s":{"99":84,"92":71,"82":62,"77":41,"80":60,"43":15,"50":30,"40":20,"34":13,"26":8},"l":{"10":33,"7":18,"19":38,"44":68,"36":53,"49":69,"76":87,"70":94,"64":74}},{"s":{"98":78,"93":68,"70":53,"75":44,"80":40,"50":11,"46":15,"54":34,"32":12,"17":7},"l":{"21":38,"5":20,"25":45,"27":49,"42":64,"55":87,"76":96,"59":82,"72":92}},{"s":{"96":83,"94":64,"71":47,"70":48,"81":62,"42":19,"56":23,"50":30,"18":6,"28":8},"l":{"25":55,"9":29,"15":35,"27":51,"40":61,"43":63,"77":95,"65":88,"68":91}},{"s":{"95":84,"91":71,"87":68,"75":49,"78":56,"50":28,"41":21,"63":45,"39":18,"31":11},"l":{"15":47,"25":42,"3":20,"55":83,"27":48,"44":59,"69":92,"62":82,"76":94}},{"s":{"99":62,"96":78,"81":61,"76":58,"73":53,"51":29,"46":26,"40":18,"37":7,"39":5},"l":{"4":20,"13":33,"16":42,"43":67,"34":54,"48":70,"59":85,"69":90,"75":91}},{"s":{"98":75,"90":70,"89":52,"77":66,"79":45,"42":18,"48":29,"55":25,"26":7,"34":10},"l":{"9":27,"5":37,"19":40,"47":73,"44":60,"31":53,"56":78,"67":95,"58":80}},{"s":{"92":73,"91":53,"76":48,"71":51,"81":41,"56":34,"58":36,"52":30,"23":6,"32":10},"l":{"7":26,"9":28,"3":22,"38":59,"35":57,"33":65,"63":85,"67":87,"62":84}},{"s":{"97":87,"99":62,"81":61,"71":51,"77":45,"41":20,"43":18,"44":26,"22":2,"27":9},"l":{"17":37,"3":14,"11":32,"55":69,"35":52,"39":63,"65":89,"76":98,"57":83}},{"s":{"91":72,"92":68,"70":48,"80":40,"77":59,"51":11,"49":28,"45":34,"39":20,"17":6},"l":{"18":37,"9":26,"25":57,"47":71,"42":64,"55":85,"79":98,"67":95,"78":96}},{"s":{"93":72,"95":73,"70":50,"71":53,"75":43,"49":13,"67":45,"40":19,"30":9,"33":7},"l":{"5":18,"6":27,"25":41,"26":52,"46":68,"44":74,"61":82,"58":86,"62":85}},{"s":{"99":79,"96":68,"75":49,"76":42,"84":62,"46":18,"57":39,"44":20,"26":5,"31":9},"l":{"7":29,"3":25,"19":45,"50":69,"33":65,"48":66,"73":92,"63":85,"60":80}},{"s":{"98":81,"92":74,"71":52,"79":41,"84":63,"42":21,"67":31,"47":32,"25":5,"37":17},"l":{"7":30,"2":23,"6":26,"27":46,"44":54,"38":64,"65":94,"59":83,"68":91}},{"s":{"92":73,"99":80,"70":48,"79":59,"76":58,"69":55,"45":19,"42":20,"28":8,"33":11},"l":{"18":46,"5":27,"25":53,"30":51,"40":61,"43":56,"74":98,"63":83,"72":91}},{"s":{"94":75,"96":81,"74":48,"72":52,"88":68,"58":41,"40":25,"64":54,"32":13,"22":4},"l":{"12":31,"6":17,"8":36,"35":63,"50":70,"27":47,"61":78,"71":91,"66":84}},{"s":{"91":72,"94":74,"80":58,"82":64,"73":45,"48":29,"40":19,"61":37,"25":3,"34":10},"l":{"4":15,"24":42,"13":36,"47":71,"46":68,"30":52,"57":81,"56":75,"76":96}},{"s":{"90":68,"97":82,"80":43,"85":64,"89":67,"42":22,"41":21,"45":23,"30":8,"29":6},"l":{"17":36,"16":32,"3":20,"44":74,"46":70,"31":51,"78":96,"63":81,"65":94}},{"s":{"96":64,"98":80,"86":54,"76":55,"83":61,"58":20,"57":19,"51":33,"27":9,"24":2},"l":{"11":31,"3":14,"12":34,"26":56,"48":68,"40":60,"69":94,"62":84,"71":91}},{"s":{"91":51,"95":66,"79":57,"82":64,"87":67,"41":23,"47":15,"53":33,"31":13,"30":9},"l":{"25":56,"6":24,"5":19,"32":52,"46":72,"44":61,"65":83,"76":96,"73":93}}];

/* ============ 2. DRAWING CODE (fire snakes + ladders) ============ */
const NOHEAD=true;
const SNAKE_COL=[
 {a:'#e8321c',b:'#ffc629',f1:'#ff6a14',f2:'#ffe066'},
 {a:'#2b86e6',b:'#c7f1ff',f1:'#5fc8ff',f2:'#ffffff'},
 {a:'#1fae63',b:'#d9f55a',f1:'#59e88a',f2:'#eaffb0'},
 {a:'#8c3fd9',b:'#ff8ae0',f1:'#b766ff',f2:'#ffd2f5'},
 {a:'#e23b7c',b:'#ffd6a8',f1:'#ff6fa0',f2:'#fff0d6'}];
const flame=(p,x,y,deg,s,c1,c2)=>{const g=el('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${deg.toFixed(0)}) scale(${s.toFixed(2)})`},p);
  el('path',{d:'M-5 0Q-7 -9 -2 -17Q-1 -10 3 -12Q8 -6 5 0Z',fill:c1,stroke:dk(c1,.45),'stroke-width':1.1},g);
  el('path',{d:'M-2.5 0Q-3.5 -5 -1 -9Q0 -5 2 -6Q4 -3 2.5 0Z',fill:c2},g)};
const C=60,NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('flat');
const pos=n=>{if(n===0)return[30,626];const r=Math.floor((n-1)/10),c=r%2?9-(n-1)%10:(n-1)%10;return[c*C+30,(9-r)*C+30]};
const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const mix=(h,t,a)=>{const n=parseInt(h.slice(1),16);return'#'+[n>>16,n>>8&255,n&255].map((v,k)=>Math.round(v+(t[k]-v)*a).toString(16).padStart(2,'0')).join('')};
const lt=(h,a)=>mix(h,[255,255,255],a),dk=(h,a)=>mix(h,[0,0,0],a);
const line=(p,a,b,col,w,o)=>el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,'stroke-width':w,'stroke-linecap':'round',...(o||{})},p);

function drawSnake(a,b,pal){
  const[x1,y1]=pos(a),[x2,y2]=pos(b);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,waves=Math.max(2,Math.round(len/85)),N=Math.max(30,Math.round(len/6.5)),P=[];
  for(let i=0;i<=N;i++){const t=i/N,o=Math.sin(t*waves*Math.PI*2)*(13*Math.sin(Math.PI*t)+3);P.push([x1+dx*t+nx*o,y1+dy*t+ny*o])}
  const W=i=>16-10*Math.pow(i/N,.8),D=dk(pal.a,.6),g=el('g',{filter:'url(#glow)'});
  const tang=i=>{const j=Math.min(i,N-1),tx=P[j+1][0]-P[j][0],ty=P[j+1][1]-P[j][1],m=Math.hypot(tx,ty)||1;return[tx/m,ty/m]};
  // fire fins along the body
  for(let i=3;i<N-2;i+=3){
    const s=(i/3)%2?1:-1,[ux,uy]=tang(i);
    [s,-s].forEach((sd,k)=>{
      if(k&&i%6)return;
      const ex=-uy*sd*.85+ux*.55,ey=ux*sd*.85+uy*.55;
      flame(g,P[i][0]-uy*sd*W(i)*.5,P[i][1]+ux*sd*W(i)*.5,Math.atan2(ey,ex)*180/Math.PI+90,(.95-.6*i/N)*W(i)/13,pal.f1,pal.f2);
    });
  }
  { const[ux,uy]=tang(N-1);flame(g,P[N][0],P[N][1],Math.atan2(uy,ux)*180/Math.PI+90,.75,pal.f1,pal.f2); }
  // body: outline, light belly edge, main scales, shine
  for(let i=0;i<N;i++)line(g,P[i],P[i+1],D,W(i)+3.4);
  for(let i=0;i<N;i++)line(g,P[i],P[i+1],pal.b,W(i));
  for(let i=0;i<N;i++)line(g,P[i],P[i+1],pal.a,W(i)*.76);
  for(let i=0;i<N;i++)line(g,P[i],P[i+1],lt(pal.a,.55),W(i)*.14,{opacity:.45});
  // diamond scale pattern
  for(let i=1;i<N-1;i+=2){
    const[ux,uy]=tang(i),s=W(i)*.32,d=el('g',{transform:`translate(${P[i][0].toFixed(1)} ${P[i][1].toFixed(1)}) rotate(${(Math.atan2(uy,ux)*180/Math.PI).toFixed(0)})`},g);
    el('polygon',{points:`${-s*1.25},0 0,${-s} ${s*1.25},0 0,${s}`,fill:pal.b,stroke:dk(pal.a,.3),'stroke-width':.6,opacity:.93},d);
  }
  if(NOHEAD)return;   // in 2.5D the head stands up instead (see headUp)
  // head, faces away from the body
  const ang=Math.atan2(P[0][1]-P[3][1],P[0][0]-P[3][0])*180/Math.PI;
  const h=el('g',{transform:`translate(${x1} ${y1}) rotate(${ang})`},g);
  [-1,1].forEach(sy=>{
    flame(h,-3,sy*10,Math.atan2(sy*.85,-.5)*180/Math.PI+90,.8,pal.f1,pal.f2);
    el('path',{d:'M4 '+(-4*sy)+' Q16 '+(-11*sy)+' 29 '+(-8*sy)+' Q18 '+(-6*sy)+' 8 '+(-1*sy)+'Z',fill:pal.b,stroke:D,'stroke-width':1.2},h);
  });
  el('path',{d:'M-13 0 Q-11 -11 2 -11 Q14 -9 22 0 Q14 9 2 11 Q-11 11 -13 0Z',fill:pal.a,stroke:D,'stroke-width':2.2},h);
  el('path',{d:'M-11 0 L16 0',stroke:lt(pal.a,.5),'stroke-width':1.6,opacity:.5,'stroke-linecap':'round'},h);
  el('polygon',{points:'-10,0 -5,-3.6 0,0 -5,3.6',fill:pal.b,stroke:D,'stroke-width':.8},h);
  el('path',{d:'M22 0 L28 0 M28 0 L32 -3 M28 0 L32 3',stroke:'#ff2d55','stroke-width':1.6,fill:'none','stroke-linecap':'round'},h);
  [-1,1].forEach(s=>{
    el('ellipse',{cx:8,cy:6*s,rx:3.8,ry:3.1,fill:'#ffe34d',stroke:'#1a0a08','stroke-width':1.2,transform:`rotate(${-18*s} 8 ${6*s})`},h);
    el('ellipse',{cx:8.6,cy:6*s,rx:1,ry:2.7,fill:'#1a0a08',transform:`rotate(${-18*s} 8 ${6*s})`},h);
    el('circle',{cx:7,cy:6*s-1.2,r:.9,fill:'#fff'},h);
    el('circle',{cx:19,cy:2*s,r:.9,fill:'#1a0a08'},h);
  });
}
function drawLadder(a,b){
  const[x1,y1]=pos(a),[x2,y2]=pos(b);
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),nx=-dy/len*9.5,ny=dx/len*9.5;
  const g=el('g',{filter:'url(#glow)'});
  for(let i=1;i<len/24;i++){const t=i*24/len,A=[x1+dx*t+nx,y1+dy*t+ny],B=[x1+dx*t-nx,y1+dy*t-ny];line(g,A,B,'#4a2d0c',8);line(g,A,B,'#ffd45e',4.2);line(g,A,B,'#fff3b0',1.3,{opacity:.8})}
  [1,-1].forEach(s=>{
    const A=[x1+nx*s,y1+ny*s],B=[x2+nx*s,y2+ny*s];
    line(g,A,B,'#2a1606',11);line(g,A,B,'#b9813f',7);line(g,A,B,'#e9b873',2,{opacity:.85});
    for(let i=1;i<len/46;i++){const t=i*46/len;el('circle',{cx:A[0]+dx*t,cy:A[1]+dy*t,r:0,fill:'none'},g)}
    [A,B].forEach(p=>{el('circle',{cx:p[0],cy:p[1],r:6,fill:'#ffd45e',stroke:'#4a2d0c','stroke-width':2},g);el('circle',{cx:p[0]-1.5,cy:p[1]-1.5,r:1.8,fill:'#fff'},g)});
  });
}

const xy=n=>pos(n);                      // square number -> x,y on the 600x600 board
const board=document.getElementById('board'),flat=svg;

/* ============ 3. SAFETY CHECK: a board is only played if it passes ============ */
function check(L){
  const ends=[];
  for(const [a,b] of Object.entries(L.l)){ if(!(a>=2 && b<=99 && +b>+a)) return false; ends.push(+a,+b); }   // ladders go up
  for(const [a,b] of Object.entries(L.s)){ if(!(b>=2 && a<=99 && +a>+b)) return false; ends.push(+a,+b); }   // snakes go down
  if(new Set(ends).size!==ends.length) return false;            // no square is used twice
  const jump=n=>L.s[n]||L.l[n]||n, seen=new Set([1]), q=[1];    // can square 100 be reached?
  while(q.length){const n=q.shift();for(let d=1;d<=6;d++){const m=n+d;if(m>100)continue;const t=jump(m);if(!seen.has(t)){seen.add(t);q.push(t)}}}
  return seen.has(100);
}
function avgRolls(L){                                            // play 1500 quick games to get the average
  let tot=0;for(let g=0;g<1500;g++){let n=1,r=0;while(n<100){r++;const m=n+1+Math.floor(Math.random()*6);if(m<=100)n=L.s[m]||L.l[m]||m}tot+=r}
  return Math.round(tot/1500);
}

/* ============ 4. STANDING PIECES (2.5D) ============ */
function stand(n,html,cls){
  const[x,y]=xy(n),w=document.createElement('div');
  w.className='pawn '+(cls||'');w.style.left=x+'px';w.style.top=y+'px';
  w.innerHTML='<i class="shadow"></i><div class="lift"><div class="up">'+html+'</div></div>';
  board.appendChild(w);return w;
}
const PAWN=['#ff3d5a','#2f8bff'],NAMES=['Red','Blue'];
const pawnSVG=(c,i)=>`<svg viewBox="0 0 40 60" width="40" height="60"><defs><radialGradient id="g${i}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs><ellipse cx="20" cy="53" rx="15" ry="5" fill="url(#g${i})"/><path d="M11 52Q15 34 17 28h6q2 6 6 24z" fill="url(#g${i})"/><ellipse cx="20" cy="28" rx="10" ry="3.5" fill="url(#g${i})"/><circle cx="20" cy="18" r="11" fill="url(#g${i})"/></svg>`;
const headUp=p=>`<svg viewBox="0 0 40 60" width="40" height="60"><path d="M6 26Q-2 14 4 3Q9 12 14 12M34 26Q42 14 36 3Q31 12 26 12" fill="${p.b}" stroke="${dk(p.a,.6)}" stroke-width="1.5"/><path d="M20 59Q6 44 8 28Q10 10 20 10Q30 10 32 28Q34 44 20 59Z" fill="${p.a}" stroke="${dk(p.a,.6)}" stroke-width="3"/><path d="M20 14v30" stroke="${lt(p.a,.5)}" stroke-width="2" opacity=".5"/><polygon points="20,17 24,21 20,26 16,21" fill="${p.b}"/><ellipse cx="13" cy="30" rx="4.5" ry="4" fill="#ffe34d" stroke="#1a0a08" stroke-width="1.3"/><ellipse cx="27" cy="30" rx="4.5" ry="4" fill="#ffe34d" stroke="#1a0a08" stroke-width="1.3"/><rect x="12.2" y="26.5" width="1.6" height="7" rx=".8" fill="#1a0a08"/><rect x="26.2" y="26.5" width="1.6" height="7" rx=".8" fill="#1a0a08"/><path d="M20 46v6m0 0l-3 4m3-4l3 4" stroke="#ff2d55" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const postUp='<svg viewBox="0 0 40 60" width="40" height="60"><rect x="16" y="14" width="8" height="44" rx="3" fill="#b9813f" stroke="#4a2d0c" stroke-width="2"/><circle cx="20" cy="12" r="7" fill="#ffd45e" stroke="#4a2d0c" stroke-width="2"/><circle cx="18" cy="10" r="2" fill="#fff"/></svg>';

/* ============ 5. BUILD ONE BOARD (runs every time you pick a board) ============ */
function buildBoard(L){
  flat.innerHTML='';board.querySelectorAll('.prop').forEach(e=>e.remove());   // wipe the old board
  const defs=el('defs',{}),f=el('filter',{id:'glow',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);
  el('feDropShadow',{dx:0,dy:2,stdDeviation:2,'flood-color':'#000','flood-opacity':.6},f);
  for(const a in L.l)drawLadder(+a,L.l[a]);
  let k=0;
  for(const a in L.s){const pal=SNAKE_COL[k++%SNAKE_COL.length];drawSnake(+a,L.s[a],pal);stand(+a,headUp(pal),'prop')}
  for(const a in L.l)stand(L.l[a],postUp,'prop');
}
for(let r=0;r<10;r++)for(let c=0;c<10;c++){const row=9-r,n=row*10+(row%2?10-c:c+1);document.getElementById('grid').insertAdjacentHTML('beforeend','<span>'+n+'</span>')}

/* ============ 6. GAME STATE + CAMERA ============ */
const FAST=+new URLSearchParams(location.search).get('fast')||1;       // ?fast=500 makes waits tiny (used for testing)
const sleep=ms=>new Promise(r=>setTimeout(r,ms/FAST));
const root=document.documentElement,FACES='⚀⚁⚂⚃⚄⚅',clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sel=document.getElementById('layout'),newBtn=document.getElementById('newgame'),roll_=document.getElementById('roll');
let SN={},LD={},cur=0,turn=0,over=false,busy=false;
const P=PAWN.map((c,i)=>({pos:1,el:stand(1,pawnSVG(c,i))}));
function put(p,n,i){const[x,y]=xy(n);p.el.style.left=(x+(i?10:-10))+'px';p.el.style.top=(y+8)+'px'}
function look(n,zoom){
  const[x,y]=xy(Math.max(n,1));
  board.style.setProperty('--cx',(300-clamp(x,90,510))+'px');
  board.style.setProperty('--cy',(300-clamp(y,120,480))+'px');
  board.style.setProperty('--zoom',zoom);
}
const tiltTo=deg=>root.style.setProperty('--tilt',deg+'deg');
function flatView(){tiltTo(0);board.style.setProperty('--cx','0px');board.style.setProperty('--cy','0px');board.style.setProperty('--zoom',1)}

function loadBoard(choice){
  cur=choice==='random'?Math.floor(Math.random()*LAYOUTS.length):+choice;
  if(!LAYOUTS[cur]||!check(LAYOUTS[cur]))cur=0;                     // never play a broken board
  const L=LAYOUTS[cur];SN=L.s;LD=L.l;buildBoard(L);
  P.forEach((p,i)=>{p.pos=1;put(p,1,i)});
  turn=0;over=false;flatView();
  msg.textContent='Red starts. Roll the die.';roll_.disabled=false;
  info.textContent=`Board ${cur+1}: ${Object.keys(LD).length} ladders, ${Object.keys(SN).length} snakes, about ${avgRolls(L)} rolls to finish`;
}

/* ============ 7. ONE TURN: tilt, follow the pawn, go flat ============ */
async function roll(){
  if(busy||over)return;
  busy=true;roll_.disabled=sel.disabled=newBtn.disabled=true;
  try{
    const p=P[turn],name=NAMES[turn],v=1+Math.floor(Math.random()*6);
    for(let i=0;i<6;i++){die.textContent=FACES[Math.floor(Math.random()*6)];await sleep(70)}
    die.textContent=FACES[v-1];msg.textContent=name+' rolled '+v;
    tiltTo(55);look(p.pos,1.25);await sleep(850);                   // 1. tilt back, zoom to the pawn
    if(p.pos+v<=100){
      for(let s=0;s<v;s++){                                          // 2. hop and follow
        p.pos++;p.el.classList.remove('hop');void p.el.offsetWidth;p.el.classList.add('hop');
        put(p,p.pos,turn);look(p.pos,1.25);await sleep(300);
      }
      const d=SN[p.pos]||LD[p.pos];
      if(d){
        msg.textContent=name+(d>p.pos?' climbs a ladder!':' slides down a snake!');
        board.classList.add('slow');p.el.classList.add('slide');
        p.pos=d;put(p,d,turn);look(d,1.25);await sleep(950);
        board.classList.remove('slow');p.el.classList.remove('slide');
      }
    }else msg.textContent=name+' needs an exact roll to finish.';
    await sleep(350);
    flatView();await sleep(850);                                     // 3. flat again
    if(p.pos===100){over=true;msg.textContent=name+' wins! 🎉';}
    else turn=1-turn;
  }finally{
    busy=false;sel.disabled=newBtn.disabled=false;roll_.disabled=over;
  }
}

/* ============ 8. WIRE UP THE CONTROLS ============ */
LAYOUTS.forEach((L,i)=>sel.insertAdjacentHTML('beforeend',`<option value="${i}">Board ${i+1}</option>`));
sel.insertAdjacentHTML('beforeend','<option value="random">Random board</option>');
sel.onchange=()=>loadBoard(sel.value);
newBtn.onclick=()=>loadBoard(sel.value);
roll_.onclick=roll;
loadBoard(0);
</script>
