<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loader.css">
</head>
<body>
<!-- Splash loader markup: keep these ids, loader.js depends on them -->
<main class="stage" id="splash">
  <div class="logo">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="t" cx="50" cy="50" r="48"/>
      <circle class="p" id="ring" cx="50" cy="50" r="48" pathLength="1000"/>
    </svg>
    <img id="logo" alt="Game logo" src="logo.png">
  </div>
  <h1 id="title">Snakes &amp; Ladders</h1>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="token" id="tok"><i></i></div>
  </div>
  <div class="row">
    <span><span class="dice" aria-hidden="true">&#127922;</span> <span id="msg">Loading</span></span>
    <span id="pct">0%</span>
  </div>
</main>

<script src="loader.js"></script>
<script>
  // ---- DEMO: fake 7 second load. Replace with your real loading code (see README). ----
  var loader = new SplashLoader({
    title: 'Snakes & Ladders',
    logo: 'logo.png',
    messages: ['Rolling the dice','Greasing the ladders','Waking the snake','Placing your token','Ready to climb'],
    onComplete: function () { console.log('Loader finished: start your game here'); }
  });
  loader.simulate(7000);
</script>
</body>
</html>
